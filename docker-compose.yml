version: '3.9'

# ── Orçamento de memória total ≤ 2 GB ──────────────────────────────────────────
# backend:  1700 m  (solver até 900 m + FastAPI/Python ~800 m)
# frontend:  256 m  (nginx a servir ficheiros estáticos)
# ─────────────────────────────────────────────────────── total: ~1956 m < 2048 m
#
# Para ajustar, cria um ficheiro .env na raiz do projeto (ver .env.example).
# ──────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/gerador_horarios.db
      - SECRET_KEY=${SECRET_KEY:-muda-esta-chave-para-algo-secreto-e-longo}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - SOLVER_MAX_MEMORY_MB=${SOLVER_MAX_MEMORY_MB:-900}
      - SOLVER_WORKERS=${SOLVER_WORKERS:-2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    expose:
      - "8000"
    mem_limit: ${BACKEND_MEM_LIMIT:-1700m}
    memswap_limit: ${BACKEND_MEM_LIMIT:-1700m}   # = mem_limit → sem swap (protege o NAS)
    oom_kill_disable: false                        # Docker mata o container se ultrapassar o limite
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-61100}:80"
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    memswap_limit: ${FRONTEND_MEM_LIMIT:-256m}    # = mem_limit → sem swap
    oom_kill_disable: false
    depends_on:
      backend:
        condition: service_healthy
